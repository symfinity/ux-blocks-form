role: floating-field
twig_name: FloatingField
groups:
  - id: examples
    section: Examples
    layout: stack
    items:
      - id: email
        label: Email
        props: {}
        slot_twig: |
          <twig:FloatingField label="Email">
              <twig:Input type="email" name="email" placeholder=" " />
          </twig:FloatingField>
      - id: with-hint
        label: "With hint"
        props: {}
        slot_twig: |
          <twig:FloatingField label="Username" hint="{{ lorem_sentence() }}">
              <twig:Input name="username" placeholder=" " />
          </twig:FloatingField>
