role: floating-field
twig_name: FloatingField
groups:
  - id: examples
    section: Examples
    layout: stack
    items:
      - id: email
        label: Email
        props: {}
        slot_twig: |
          <twig:FloatingField label="{{ lorem_words(1)|capitalize }}">
              <twig:Input type="email" name="email" placeholder="you@example.com" />
          </twig:FloatingField>
      - id: with-hint
        label: "With hint"
        props: {}
        slot_twig: |
          <twig:FloatingField label="{{ lorem_words(1)|capitalize }}" hint="{{ lorem_sentence() }}">
              <twig:Input name="username" placeholder="{{ lorem_words(2) }}" />
          </twig:FloatingField>
