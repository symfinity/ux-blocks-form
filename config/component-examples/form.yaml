role: form
twig_name: Form
groups:
  - id: examples
    section: Examples
    layout: stack
    items:
      - id: post
        label: "POST form"
        props: {}
        slot_twig: |
          <twig:Form method="post" action="/save" title="Profile">
              <twig:Field label="{{ lorem_words(1)|capitalize }}">
                  <twig:Input name="name" placeholder="{{ lorem_words(2) }}" />
              </twig:Field>
              <twig:FormActions>
                  <twig:Button type="submit" variant="primary">{{ lorem_words(1)|capitalize }}</twig:Button>
              </twig:FormActions>
          </twig:Form>
