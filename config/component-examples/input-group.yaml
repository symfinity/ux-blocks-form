role: input-group
twig_name: InputGroup
groups:
  - id: examples
    section: Examples
    layout: stack
    items:
      - id: default
        label: "With addon"
        props: {}
        slot_twig: |
          <twig:InputGroup>
              <twig:Input name="q" placeholder="{{ lorem_words(2) }}" />
              <twig:Button variant="primary">{{ lorem_words(1)|capitalize }}</twig:Button>
          </twig:InputGroup>
